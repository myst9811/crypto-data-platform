services:
  # ─── Infrastructure ───
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - crypto-net
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - crypto-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: crypto-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - crypto-net
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/kafka/init-topics.sh:/scripts/init-topics.sh
    entrypoint: ["/bin/bash", "/scripts/init-topics.sh"]
    networks:
      - crypto-net

  # ─── Producers ───
  binance-producer:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/producer/Dockerfile
    container_name: binance-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: ["python", "-m", "src.ingestion.binance_producer"]
    networks:
      - crypto-net
    restart: unless-stopped

  coinbase-producer:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/producer/Dockerfile
    container_name: coinbase-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: ["python", "-m", "src.ingestion.coinbase_producer"]
    networks:
      - crypto-net
    restart: unless-stopped

  kraken-producer:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/producer/Dockerfile
    container_name: kraken-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: ["python", "-m", "src.ingestion.kraken_producer"]
    networks:
      - crypto-net
    restart: unless-stopped

  # ─── Spark Streaming ───
  spark-streaming:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-streaming
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: >
      python -m src.processing.spark_streaming
        --config config/spark_config_docker.yaml
    volumes:
      - delta-data:/app/data
    networks:
      - crypto-net
    restart: unless-stopped

  # ─── FastAPI ───
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-api
    depends_on:
      - spark-streaming
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: >
      uvicorn src.serving.api.main:app
        --host 0.0.0.0 --port 8000
    volumes:
      - delta-data:/app/data
      - ml-artifacts:/app/ml/artifacts
      - mlruns:/app/mlruns
    networks:
      - crypto-net
    restart: unless-stopped

  # ─── Streamlit Dashboard ───
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-dashboard
    depends_on:
      - api
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000/api/v1
    command: >
      streamlit run src/serving/dashboard/app.py
        --server.port 8501
        --server.address 0.0.0.0
        --server.headless true
    volumes:
      - delta-data:/app/data
      - ml-artifacts:/app/ml/artifacts
    networks:
      - crypto-net
    restart: unless-stopped

networks:
  crypto-net:
    driver: bridge

volumes:
  zookeeper-data:
  kafka-data:
  delta-data:
  ml-artifacts:
  mlruns:
