spark:
  app_name: "crypto-streaming-pipeline"
  master: "local[2]"

  config:
    spark.driver.memory: "2g"
    spark.sql.shuffle.partitions: 4
    spark.sql.streaming.schemaInference: "true"

    # Delta Lake
    spark.sql.extensions: "io.delta.sql.DeltaSparkSessionExtension"
    spark.sql.catalog.spark_catalog: "org.apache.spark.sql.delta.catalog.DeltaCatalog"
    spark.databricks.delta.retentionDurationCheck.enabled: "false"
    spark.databricks.delta.schema.autoMerge.enabled: "true"

    # Kafka backpressure
    spark.streaming.kafka.maxRatePerPartition: 100
    spark.streaming.backpressure.enabled: "true"

    # Serialization
    spark.serializer: "org.apache.spark.serializer.KryoSerializer"

# Streaming
streaming:
  trigger:
    processing_time: "10 seconds"
  watermark:
    delay: "10 seconds"
  batch_size: 1000
  output_mode: "append"

# Kafka source
kafka:
  bootstrap_servers: "localhost:9092"
  subscribe: "raw-trades,raw-orderbook,raw-ticker"
  starting_offsets: "latest"
  fail_on_data_loss: "false"
  max_offsets_per_trigger: 10000

# Delta Lake paths
delta_lake:
  base_path: "./data"

  bronze:
    trades: "./data/bronze/trades"
    ticker: "./data/bronze/ticker"

  silver:
    prices: "./data/silver/prices"

  gold:
    vwap: "./data/gold/vwap"
    spreads: "./data/gold/spreads"
    arbitrage_signals: "./data/gold/arbitrage_signals"

  checkpoints:
    bronze: "./data/checkpoints/bronze"
    silver: "./data/checkpoints/silver"
    gold: "./data/checkpoints/gold"

# Window configurations
windows:
  minute_1:
    duration: "1 minute"

# Arbitrage detection
arbitrage:
  threshold_percent: 0.15
  min_volume: 0.01
  max_spread_age_seconds: 10

# Data quality
data_quality:
  max_null_percentage: 5
  max_outlier_std_dev: 3
  min_records_per_batch: 10
  freshness_threshold_seconds: 60
