spark:
  app_name: "crypto-streaming-pipeline"
  master: "spark://spark-master:7077"

  # Spark configuration
  config:
    spark.executor.memory: "2g"
    spark.driver.memory: "1g"
    spark.executor.cores: 2
    spark.sql.streaming.checkpointLocation: "/opt/spark-data/checkpoints"
    spark.sql.streaming.schemaInference: "true"
    spark.sql.shuffle.partitions: 10

    # Delta Lake configurations
    spark.sql.extensions: "io.delta.sql.DeltaSparkSessionExtension"
    spark.sql.catalog.spark_catalog: "org.apache.spark.sql.delta.catalog.DeltaCatalog"
    spark.databricks.delta.retentionDurationCheck.enabled: "false"
    spark.databricks.delta.schema.autoMerge.enabled: "true"

    # Kafka configurations
    spark.streaming.kafka.maxRatePerPartition: 100
    spark.streaming.backpressure.enabled: "true"

    # Serialization
    spark.serializer: "org.apache.spark.serializer.KryoSerializer"

# Streaming configurations
streaming:
  trigger:
    processing_time: "10 seconds"

  watermark:
    delay: "30 seconds"

  batch_size: 1000

  output_mode: "append"

# Kafka source configuration - Docker network addresses
kafka:
  bootstrap_servers: "kafka:29092"
  subscribe: "raw-trades,raw-orderbook,raw-ticker"
  starting_offsets: "latest"
  fail_on_data_loss: "false"
  max_offsets_per_trigger: 10000

# Delta Lake paths - Docker volume paths
delta_lake:
  base_path: "/opt/spark-data"

  bronze:
    trades: "/opt/spark-data/bronze/trades"
    orderbook: "/opt/spark-data/bronze/orderbook"
    ticker: "/opt/spark-data/bronze/ticker"

  silver:
    trades: "/opt/spark-data/silver/trades"
    orderbook: "/opt/spark-data/silver/orderbook"
    ticker: "/opt/spark-data/silver/ticker"
    normalized_prices: "/opt/spark-data/silver/normalized_prices"

  gold:
    arbitrage_opportunities: "/opt/spark-data/gold/arbitrage_opportunities"
    volume_aggregates: "/opt/spark-data/gold/volume_aggregates"
    liquidity_metrics: "/opt/spark-data/gold/liquidity_metrics"
    vwap: "/opt/spark-data/gold/vwap"

  checkpoints:
    bronze: "/opt/spark-data/checkpoints/bronze"
    silver: "/opt/spark-data/checkpoints/silver"
    gold: "/opt/spark-data/checkpoints/gold"

# Window configurations for aggregations
windows:
  minute_1:
    duration: "1 minute"
    slide: "30 seconds"

  minute_5:
    duration: "5 minutes"
    slide: "1 minute"

  minute_15:
    duration: "15 minutes"
    slide: "5 minutes"

  hour_1:
    duration: "1 hour"
    slide: "15 minutes"

# Arbitrage detection configuration
arbitrage:
  threshold_percent: 0.5
  min_volume: 1.0
  max_spread_age_seconds: 10

# Data quality thresholds
data_quality:
  max_null_percentage: 5
  max_outlier_std_dev: 3
  min_records_per_batch: 10
  freshness_threshold_seconds: 60
